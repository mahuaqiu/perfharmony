[package]
name = "perfharmony"
version = "0.2.2"
edition = "2021"

[lib]
name = "perfharmony"
crate-type = ["cdylib"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
parking_lot = "0.12"
pyo3 = { version = "0.22", features = ["extension-module"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
